<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Spam Message Detector</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;

            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;

            padding: 15px;

            border: 2px solid #ddd;
            border-radius: 10px;

            resize: none;

            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #555;
        }

        button {
            width: 100%;

            margin-top: 15px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        #result {
            display: none;

            margin-top: 25px;
            padding: 20px;

            border-radius: 10px;
            text-align: center;
        }

        .spam {
            background: #ffe5e5;
            border: 2px solid #ff4d4d;
        }

        .ham {
            background: #e5ffe9;
            border: 2px solid #39a852;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .probability {
            margin-top: 10px;
            font-size: 16px;
        }

        .processed {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>📱 AI Spam Detector</h1>

        <p class="subtitle">
            NLP + spaCy + BiLSTM + FastAPI
        </p>


        <textarea
            id="message"
            placeholder="Enter your SMS message here..."
        ></textarea>


        <button onclick="checkMessage()">
            Check Message
        </button>


        <div id="loading">
            🔄 Analyzing message...
        </div>


        <div id="result">

            <div id="prediction" class="prediction"></div>

            <div id="confidence"></div>

            <div class="probability">
                Spam Probability:
                <strong id="spamProbability"></strong>
            </div>

            <div class="processed">
                <strong>Processed text:</strong>
                <p id="processedText"></p>
            </div>

        </div>

    </div>


<script>

async function checkMessage() {

    const message = document
        .getElementById("message")
        .value
        .trim();


    // Check empty message

    if (message === "") {

        alert("Please enter a message.");

        return;
    }


    // Elements

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    const prediction =
        document.getElementById("prediction");

    const confidence =
        document.getElementById("confidence");

    const spamProbability =
        document.getElementById("spamProbability");

    const processedText =
        document.getElementById("processedText");


    // Show loading

    loading.style.display = "block";

    result.style.display = "none";


    try {

        // Send request to FastAPI

        const response = await fetch(
            "https://spam-detection-57pu.onrender.com/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );


        // Check API error

        if (!response.ok) {

            throw new Error(
                "API request failed: " + response.status
            );
        }


        // Convert response to JSON

        const data = await response.json();


        // Hide loading

        loading.style.display = "none";

        result.style.display = "block";


        // Prediction

        prediction.innerText =
            data.prediction;


        // Confidence

        confidence.innerText =
            "Confidence: " +
            (data.confidence * 100).toFixed(2) +
            "%";


        // Spam probability

        spamProbability.innerText =
            (data.spam_probability * 100).toFixed(2) +
            "%";


        // Processed text

        processedText.innerText =
            data.processed_message;


        // Change result style

        result.className = "";


        if (data.prediction === "SPAM") {

            result.classList.add("spam");

            prediction.innerText =
                "🚨 SPAM MESSAGE";

        } else {

            result.classList.add("ham");

            prediction.innerText =
                "✅ HAM MESSAGE";
        }

    }

    catch (error) {

        loading.style.display = "none";

        alert(
            "Cannot connect to FastAPI.\n\n" +
            "Make sure the backend is running."
        );

        console.error(error);
    }
}

</script>

</body>

</html>
